name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet build KeyBridge.sln -c Release
      - run: dotnet run --project tests/KeyBridge.Usb.Tests -c Release --no-build
      - run: dotnet run --project tests/KeyBridge.Core.Tests -c Release --no-build
      - run: node --test tests/webauthn/helpers.test.mjs
      - run: node tests/webauthn/server.test.mjs
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x android/gradlew
      - run: ./gradlew :core:test :app:assembleDebug --no-daemon
        working-directory: android
